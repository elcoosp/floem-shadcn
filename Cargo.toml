[package]
name = "floem-shadcn"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "shadcn/ui inspired components for Floem"
license = "MIT"
repository = "https://github.com/elcoosp/floem-shadcn"
keywords = ["floem", "shadcn", "gui", "components", "ui"]
categories = ["gui"]

[dependencies]
# Keep this declaration **bare** (no `branch`/`tag`): `floem-tailwind` declares
# its own floem dependency bare, and a branch-qualified twin would create a
# second package id — two floem feature-variants in one graph, with
# `TailwindExt` implemented against the wrong one ("no method `w_full` on
# `floem::style::Style`"). Bare declarations unify by resolved rev.
floem = { git = "https://github.com/lapce/floem" }
# 0.1.x shipped `floem-tailwind = { path = "https://…" }` — a URL is not a
# valid path dependency and broke every consumer. Git dep, as intended.
floem-tailwind = { git = "https://github.com/elcoosp/floem-tailwind", rev = "7329b302ad67306a5c5d21c63f55d332b0b44ede" }
num-traits = "0.2"

[dev-dependencies]
# Bare git, same source id as the main `floem` dependency (see above).
floem-test = { git = "https://github.com/lapce/floem" }
serial_test = "3"

# Keep the tree lean during tests/examples; CI builds GUI deps headlessly.
[profile.test]
debug = 0
strip = "debuginfo"

[profile.dev]
debug = 0
strip = "debuginfo"

[[example]]
name = "showcase"
path = "examples/showcase.rs"

[[example]]
name = "combobox_test"
path = "examples/combobox_test.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
