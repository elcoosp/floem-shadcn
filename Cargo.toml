[package]
name = "floem-shadcn"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "shadcn/ui inspired components for Floem"
license = "MIT"
repository = "https://github.com/elcoosp/floem-shadcn"
keywords = ["floem", "shadcn", "gui", "components", "ui"]
categories = ["gui"]

[dependencies]
floem = { git = "https://github.com/lapce/floem" }
floem-tailwind = { path = "https://github.com/elcoosp/floem-tailwind" }
num-traits = "0.2"

[dev-dependencies]
floem-test = { git = "https://github.com/lapce/floem" }
serial_test = "3"

# Keep the tree lean during tests/examples; CI builds GUI deps headlessly.
[profile.test]
debug = 0
strip = "debuginfo"

[profile.dev]
debug = 0
strip = "debuginfo"

[[example]]
name = "showcase"
path = "examples/showcase.rs"

[[example]]
name = "combobox_test"
path = "examples/combobox_test.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
